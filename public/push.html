<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>摄像头推流 — Live777</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    background: linear-gradient(135deg, #0b1121 0%, #0c263d 30%, #321e3a 70%, #0c263d 100%);
    color: #e5e7eb;
    min-height: 100vh;
    display: flex; flex-direction: column; align-items: center; padding: 20px;
  }
  h1 { font-size: 1.5rem; color: #60a5fa; margin: 1rem 0; }
  .panel {
    background: rgba(17, 24, 39, 0.85);
    backdrop-filter: blur(10px);
    border: 1px solid rgba(75, 85, 99, 0.3);
    border-radius: 16px;
    padding: 24px;
    width: 100%;
    max-width: 720px;
    margin-bottom: 16px;
  }
  .row {
    display: flex; gap: 12px; align-items: center; flex-wrap: wrap; margin-bottom: 12px;
  }
  label { font-size: 0.85rem; color: #9ca3af; min-width: 70px; }
  input, select {
    flex: 1; min-width: 180px;
    padding: 10px 14px;
    background: rgba(0,0,0,0.4);
    border: 1px solid rgba(75,85,99,0.4);
    border-radius: 10px;
    color: #e5e7eb; font-size: 0.9rem;
    outline: none;
    font-family: inherit;
  }
  input:focus, select:focus { border-color: #60a5fa; }
  select { cursor: pointer; }
  button {
    padding: 10px 24px;
    border-radius: 10px;
    border: none;
    font-size: 0.9rem; font-weight: 600;
    cursor: pointer;
    transition: all 0.2s;
  }
  .btn-start { background: #2563eb; color: white; }
  .btn-start:hover { background: #1d4ed8; }
  .btn-start:disabled { background: #374151; color: #6b7280; cursor: not-allowed; }
  .btn-stop { background: #dc2626; color: white; }
  .btn-stop:hover { background: #b91c1c; }
  .btn-copy { background: #374151; color: #e5e7eb; font-size: 0.8rem; padding: 6px 14px; }
  .btn-copy:hover { background: #4b5563; }

  video { width: 100%; max-width: 640px; border-radius: 12px; background: #000; margin: 12px 0; aspect-ratio: 16/10; object-fit: cover; }
  .preview-section { display: flex; flex-direction: column; align-items: center; }

  .status {
    display: inline-flex; align-items: center; gap: 6px;
    padding: 4px 12px; border-radius: 20px; font-size: 0.8rem;
  }
  .status-idle { background: #374151; color: #9ca3af; }
  .status-connecting { background: #78350f; color: #fbbf24; }
  .status-connected { background: #064e3b; color: #34d399; }
  .status-disconnected { background: #7f1d1d; color: #f87171; }
  .dot { width: 8px; height: 8px; border-radius: 50%; }
  .dot-idle { background: #6b7280; }
  .dot-connecting { background: #fbbf24; animation: pulse 1s infinite; }
  .dot-connected { background: #34d399; }
  .dot-disconnected { background: #f87171; }
  @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.3} }

  .url-box {
    background: #000; padding: 10px 14px; border-radius: 8px;
    font-family: monospace; font-size: 0.85rem; color: #34d399;
    word-break: break-all; user-select: all;
  }
  .hint { font-size: 0.8rem; color: #6b7280; margin-top: 4px; }

  .step { background: rgba(96,165,250,0.1); border-left: 3px solid #60a5fa; padding: 10px 16px; border-radius: 0 8px 8px 0; margin: 8px 0; font-size: 0.85rem; }
  .step code { color: #60a5fa; background: rgba(96,165,250,0.15); padding: 1px 6px; border-radius: 4px; }
</style>
</head>
<body>
<h1>📹 摄像头推流 → Live777</h1>

<div class="panel">
  <div class="row">
    <label>流 ID</label>
    <input type="text" id="streamId" value="my-camera" placeholder="my-camera">
  </div>
  <div class="row">
    <label>摄像头</label>
    <select id="cameraSelect"></select>
  </div>
  <div class="row">
    <label>麦克风</label>
    <select id="micSelect"></select>
  </div>
  <div class="row" style="justify-content: flex-end; gap: 10px;">
    <button class="btn-start" id="btnStart" onclick="startStream()">开始推流</button>
    <button class="btn-stop" id="btnStop" onclick="stopStream()" disabled>停止推流</button>
  </div>
  <div style="margin-top: 8px;">
    <span class="status status-idle" id="statusBadge">
      <span class="dot dot-idle"></span> 未推流
    </span>
  </div>
</div>

<div class="panel preview-section">
  <h3 style="margin-bottom:8px;color:#9ca3af">本地预览</h3>
  <video id="preview" autoplay playsinline muted></video>
</div>

<div class="panel" id="playerPanel" style="display:none;">
  <h3 style="margin-bottom:8px;color:#9ca3af">✅ 推流已就绪</h3>
  <div class="step">
    <strong>在 Live777 Player 中打开：</strong><br>
    打开 <code>http://localhost:3000</code>，输入以下 WHEP 地址：
  </div>
  <div class="url-box" id="whepUrl" style="margin:8px 0;"></div>
  <div class="hint" id="live777UrlHint"></div>
  <button class="btn-copy" onclick="copyUrl()" style="margin-top:8px;">📋 复制播放地址</button>
</div>

<script>
  let stream = null
  let pc = null
  let currentStreamId = ''
  // 通过当前页面的 origin 走 Vite 代理，避免 CORS
  // Vite 将 /whip/* 代理到 http://localhost:7777
  const LIVE777 = window.location.origin

  async function loadDevices() {
    // Request permission first
    try { await navigator.mediaDevices.getUserMedia({ video: true, audio: true }) } catch(e) {}
    const devices = await navigator.mediaDevices.enumerateDevices()
    const cameras = devices.filter(d => d.kind === 'videoinput')
    const mics = devices.filter(d => d.kind === 'audioinput')

    const camSelect = document.getElementById('cameraSelect')
    camSelect.innerHTML = cameras.map((d, i) =>
      `<option value="${d.deviceId}">${d.label || 'Camera ' + (i+1)}</option>`
    ).join('')

    const micSelect = document.getElementById('micSelect')
    micSelect.innerHTML = mics.map((d, i) =>
      `<option value="${d.deviceId}">${d.label || 'Mic ' + (i+1)}</option>`
    ).join('')
  }

  async function startStream() {
    const streamId = document.getElementById('streamId').value.trim()
    if (!streamId) { alert('请输入流 ID'); return }
    currentStreamId = streamId

    const cameraId = document.getElementById('cameraSelect').value
    const micId = document.getElementById('micSelect').value

    setStatus('connecting', '连接中...')

    try {
      // Get camera stream
      stream = await navigator.mediaDevices.getUserMedia({
        video: { deviceId: cameraId ? { exact: cameraId } : undefined, width: 1280, height: 720 },
        audio: { deviceId: micId ? { exact: micId } : undefined }
      })

      // Show preview
      document.getElementById('preview').srcObject = stream

      // WHIP publish
      pc = new RTCPeerConnection({
        iceServers: [
          { urls: 'stun:stun.l.google.com:19302' },
          { urls: 'stun:stun.22333.fun' }
        ]
      })

      // Add tracks
      stream.getTracks().forEach(track => pc.addTrack(track, stream))

      // Create offer
      const offer = await pc.createOffer()
      await pc.setLocalDescription(offer)

      // Wait for ICE gathering
      await waitForIceGathering(pc)

      // Send WHIP request
      const whipUrl = `${LIVE777}/whip/${streamId}`
      const resp = await fetch(whipUrl, {
        method: 'POST',
        headers: { 'Content-Type': 'application/sdp' },
        body: pc.localDescription.sdp
      })

      if (!resp.ok) {
        throw new Error(`WHIP publish failed: ${resp.status}`)
      }

      // Get answer and set it
      const answerSdp = await resp.text()
      await pc.setRemoteDescription({ type: 'answer', sdp: answerSdp })

      // Monitor connection
      pc.onconnectionstatechange = () => {
        const state = pc.connectionState
        console.log('WHIP connection:', state)
        if (state === 'connected') setStatus('connected', '推流中')
        else if (state === 'failed' || state === 'disconnected' || state === 'closed')
          setStatus('disconnected', state)
      }

      setStatus('connected', '推流中')

      // Show player URL (relative path works because Player dev server proxies /whep/* too)
      const whepUrlStr = `/whep/${streamId}`
      document.getElementById('whepUrl').textContent = whepUrlStr
      document.getElementById('live777UrlHint').innerHTML =
        `在 Player 中输入此地址即可播放。也可以直接在 Live777 Web UI (<code>http://localhost:7777</code>) 中播放——创建 New stream，选 WHEP 模式，输入 Stream ID: <code>${streamId}</code>`
      document.getElementById('playerPanel').style.display = ''

      // Update buttons
      document.getElementById('btnStart').disabled = true
      document.getElementById('btnStop').disabled = false

    } catch(err) {
      console.error(err)
      setStatus('disconnected', '失败')
      alert('推流失败: ' + err.message)
    }
  }

  async function stopStream() {
    try {
      if (pc) {
        // Send WHIP DELETE through Vite proxy
        await fetch(`${LIVE777}/whip/${currentStreamId}`, { method: 'DELETE' })
        pc.close()
        pc = null
      }
    } catch(e) { console.warn(e) }

    if (stream) {
      stream.getTracks().forEach(t => t.stop())
      stream = null
    }

    document.getElementById('preview').srcObject = null
    document.getElementById('playerPanel').style.display = 'none'
    document.getElementById('btnStart').disabled = false
    document.getElementById('btnStop').disabled = true
    setStatus('idle', '未推流')
  }

  function setStatus(state, text) {
    const badge = document.getElementById('statusBadge')
    badge.className = 'status status-' + state
    badge.innerHTML = `<span class="dot dot-${state}"></span> ${text}`
  }

  function waitForIceGathering(pc) {
    return new Promise(resolve => {
      if (pc.iceGatheringState === 'complete') { resolve(); return }
      pc.onicegatheringstatechange = () => {
        if (pc.iceGatheringState === 'complete') resolve()
      }
    })
  }

  function copyUrl() {
    const url = document.getElementById('whepUrl').textContent
    navigator.clipboard.writeText(url).then(() => alert('已复制到剪贴板'))
  }

  loadDevices()
</script>
</body>
</html>
